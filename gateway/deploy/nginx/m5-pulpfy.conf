# /etc/nginx/conf.d/m5-pulpfy.conf
# m5.pulpfy.com: Stack-Chan gateway (container stackchan-gateway, /var/www/stackchan-gateway)
limit_req_zone $binary_remote_addr zone=m5_gateway:1m rate=10r/s;
limit_req_zone $binary_remote_addr zone=m5_login:1m rate=10r/m;

# No query strings in the access log (robot audio links carry one-time codes).
log_format m5_noquery '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
                      '$status $body_bytes_sent "$http_user_agent"';
